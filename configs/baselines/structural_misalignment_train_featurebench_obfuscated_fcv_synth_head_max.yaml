plugin: structural_misalignment
fidelity_mode: llm

# Everything wired: synth data + all four architecture upgrades. Ablate against
# _fcv_synth (data only) and _fcv_synth_head (deterministic features only).
#   node_security_features     : base64/hex/sink features per code node
#   grounding_residual_feature : recovered "ungrounded mass" readout
#   edge_weighted_grounding    : grounds conv consumes similarity scores (GraphConv)
#   node_aux_labels + aux_weight: per-code-node injection BCE (needs synth rows
#                                 regenerated with injection_markers to activate)
#   encoder_finetune           : re-encode LIVE (added/modified) code nodes with the
#                                 top-N CodeBERT layers trainable (encoder_lr)
#   contrastive_weight         : SupCon on graph embeddings within each batch
# All config-gated; heldout stays byte-identical to the non-augmented run.
data_preparation:
  benign_attack_dataset_paths:
    - outputs/attacks/gemini3_flash/full/featurebench_full_none/attack_dataset.jsonl
    - outputs/attacks/claude37_sonnet_sweagent/full/featurebench_full_none/attack_dataset.jsonl
    - outputs/synth/gemini/synth_benign.jsonl
    - outputs/synth/claude/synth_benign.jsonl
  malicious_attack_dataset_paths:
    - outputs/attacks/gemini3_flash/full/featurebench_full_fcv_cwe78_base64_obfuscated/attack_dataset.jsonl
    - outputs/attacks/claude37_sonnet_sweagent/full/featurebench_full_fcv_cwe78_base64_obfuscated/attack_dataset.jsonl
    - outputs/synth/gemini/synth_malicious.jsonl
    - outputs/synth/claude/synth_malicious.jsonl
  split_strategy: by_instance
  test_fraction: 0.30
  split_seed: 42

training:
  output_dir: data/models/structural_misalignment/featurebench_obfuscated_perattack_synth_head_max_20260903/fcv/hetero_gnn
  hidden_dim: 128
  dropout: 0.1
  learning_rate: 0.001
  epochs: 30
  batch_size: 4
  seed: 42
  classifier_head: mlp
  aux_weight: 0.5
  contrastive_weight: 0.1
  encoder_lr: 0.00002
  embedding_model_name: microsoft/codebert-base
  embedding_pooling: mean
  embedding_device: cuda
  embedding_batch_size: 4
  link_similarity_threshold: 0.35
  link_topk_per_subtask: 3
  link_topk_fallback: 1

graph_pipeline:
  allow_hunk_fallback: true
  allow_hunk_fallback_non_toy: true
  fallback_to_deterministic_subtasks_on_llm_failure: true
  subtask_chunking_enabled: true
  subtask_chunk_max_chars: 2000
  node_security_features: true
  grounding_residual_feature: true
  edge_weighted_grounding: true
  node_aux_labels: true
  encoder_finetune: true
  encoder_trainable_layers: 2
  encoder_max_len: 128
  encoder_scope: added
  embedding_model_name: microsoft/codebert-base
  embedding_pooling: mean
  embedding_device: cuda
  embedding_batch_size: 4
  link_similarity_threshold: 0.35
  link_topk_per_subtask: 3
  link_topk_fallback: 1
  parsers:
    prompt: llm_subtasks
    patch: cfg_ast_scoped
    linking: embedding_similarity
  llm:
    provider: gemini_vertex
    model: gemini-3-flash-preview
    temperature: 0.2
    max_retries: 2
    backoff_sec: 5.0
    allow_provider_fallback: false
